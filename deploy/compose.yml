name: secure-chat

services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    restart: unless-stopped
    init: true
    env_file:
      - backend.env
    environment:
      PORT: "5000"
      MONGO_URL: mongodb://db:27017
      DB_NAME: secure_chat
      ALLOWED_ORIGINS: ${APP_ORIGIN:?APP_ORIGIN must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    logging: *logging

  db:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
