services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://db:27017
      - DB_NAME=chat
      - RUST_LOG=debug
    command: cargo watch -x run

  db:
    ports:
      - "27017:27017"

volumes:
  cargo_cache:
  target_cache:
