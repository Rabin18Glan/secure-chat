services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://db:27017
      - DB_NAME=${DB_NAME:-chat}
      - RUST_LOG=info

  db:
    restart: always
